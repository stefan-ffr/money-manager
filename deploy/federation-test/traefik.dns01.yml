version: '3.8'

# Traefik with Let's Encrypt DNS-01 (works for internal hosts not reachable on
# 80/443). One Traefik per LXC/instance.
#
# NOTE: We use Traefik's FILE provider (not the Docker provider) on purpose:
# Docker Engine 29+ removed API versions < 1.40, and Traefik's Docker-provider
# client fails to negotiate against it ("client version 1.24 is too old").
# The file provider avoids the Docker socket entirely and routes by container
# name over the shared `traefik-public` network.
#
# Set DOMAIN, ACME_EMAIL and the Cloudflare token in .env (see .env.example),
# and put your domain into dynamic/app.yml (the router Host rule).

services:
  traefik:
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${DNS_PROVIDER:-cloudflare}"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=${LOG_LEVEL:-INFO}"
    environment:
      - TZ=Europe/Zurich
      # Cloudflare DNS-01 token (scope Zone:DNS:Edit + Zone:Zone:Read)
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./letsencrypt:/letsencrypt
      - ./dynamic:/etc/traefik/dynamic:ro
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
