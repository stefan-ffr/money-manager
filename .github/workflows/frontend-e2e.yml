name: Frontend e2e (Playwright + virtual WebAuthn)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t money-backend:ci -f backend/Dockerfile .

      - name: Build frontend image (domain-agnostic, same-origin /api proxy)
        run: docker build -t money-frontend:ci --build-arg VITE_API_URL= -f frontend/Dockerfile frontend

      - name: Start stack
        run: docker compose -f deploy/e2e-frontend/docker-compose.yml up -d

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps + Playwright (Chromium)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/ >/dev/null 2>&1 && curl -fsS http://localhost:8080/api/v1/settings/currencies >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Run Playwright e2e (chromium / functional)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test --project=chromium

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f deploy/e2e-frontend/docker-compose.yml logs --tail 120

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f deploy/e2e-frontend/docker-compose.yml down -v

  responsive:
    name: Responsive layout (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - responsive-android-360x640
          - responsive-android-360x800
          - responsive-iphone-se
          - responsive-iphone-14
          - responsive-android-411x891
          - responsive-ipad-portrait
          - responsive-ipad-landscape
          - responsive-laptop-1280
          - responsive-desktop-1920
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t money-backend:ci -f backend/Dockerfile .

      - name: Build frontend image
        run: docker build -t money-frontend:ci --build-arg VITE_API_URL= -f frontend/Dockerfile frontend

      - name: Start stack
        run: docker compose -f deploy/e2e-frontend/docker-compose.yml up -d

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps + Playwright (Chromium)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/ >/dev/null 2>&1 && curl -fsS http://localhost:8080/api/v1/settings/currencies >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Run responsive matrix (${{ matrix.project }})
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test --project=${{ matrix.project }}

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f deploy/e2e-frontend/docker-compose.yml logs --tail 120

      - name: Upload Playwright report (${{ matrix.project }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-${{ matrix.project }}
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f deploy/e2e-frontend/docker-compose.yml down -v
