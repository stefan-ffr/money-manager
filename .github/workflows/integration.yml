name: Integration (two-instance federation e2e)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t money-backend:ci -f backend/Dockerfile .

      - name: Start two-instance stack
        run: docker compose -f deploy/integration-test/docker-compose.yml up -d

      - name: Run end-to-end + smoke tests
        run: bash deploy/integration-test/run.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/integration-test/docker-compose.yml logs --tail 120

      - name: Tear down
        if: always()
        run: docker compose -f deploy/integration-test/docker-compose.yml down -v
